name: Reproducibility failure
description: Report a verification, paper-build, or metadata failure.
title: "[reproduce] "
labels: [reproducibility]
body:
  - type: input
    id: commit
    attributes:
      label: Commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, prover version, or container image.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
