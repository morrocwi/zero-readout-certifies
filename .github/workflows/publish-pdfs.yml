name: publish-pdfs

on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-pdfs-main
  cancel-in-progress: true

jobs:
  publish:
    name: Refresh readable PDFs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils

      - name: Build verified PDFs
        run: make paper

      - name: Commit convenience copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/main.pdf paper/onepager.pdf
          if git diff --cached --quiet; then
            echo "PDFs already match the verified sources"
            exit 0
          fi
          git commit -m "Refresh compiled paper PDFs [skip ci]"
          git push origin HEAD:main
