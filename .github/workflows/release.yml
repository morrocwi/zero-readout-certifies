name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Build and publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag against metadata
        run: python scripts/check_version.py "${GITHUB_REF_NAME}"
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils
      - name: Build release artifacts
        run: |
          make paper
          sha256sum paper/main.pdf paper/onepager.pdf > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME} - What a Zero Readout Certifies" \
            --generate-notes \
            paper/main.pdf \
            paper/onepager.pdf \
            SHA256SUMS
