name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Coq 8.20
            image: coqorg/coq:8.20
            compiler: coqc
          - label: Rocq 9.2
            image: rocq/rocq-prover:9.2
            compiler: rocq compile
    steps:
      - uses: actions/checkout@v4
      - name: Compile and audit assumptions
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/src:ro"
          "${{ matrix.image }}"
          bash -lc
          'cp -a /src /tmp/zero-readout && cd /tmp/zero-readout && make verify COQC="${{ matrix.compiler }}"'

  paper:
    name: Paper build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils
      - name: Build PDFs
        run: make paper
      - name: Check page contract
        run: |
          test "$(pdfinfo paper/onepager.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo paper/main.pdf | awk '/^Pages:/ {print $2}')" -ge "5"
      - uses: actions/upload-artifact@v7
        with:
          name: papers
          path: |
            paper/main.pdf
            paper/onepager.pdf
          if-no-files-found: error

  metadata:
    name: Metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate citation metadata
        run: |
          python -m pip install --disable-pip-version-check cffconvert==2.0.0
          cffconvert --validate
      - name: Validate JSON metadata
        run: |
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool .zenodo.json >/dev/null

  repository-audit:
    name: Repository audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make audit
